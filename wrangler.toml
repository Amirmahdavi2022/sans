name = "sans"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = false

# The custom domain gives the hostname its DNS record and certificate. The zone
# also carries a wildcard route (*.ctrjmc.xyz/*) for another Worker, and routes
# run before custom domains, so a more specific route is added for this host.
routes = [
  { pattern = "sans.ctrjmc.xyz", custom_domain = true },
  { pattern = "sans.ctrjmc.xyz/*", zone_name = "ctrjmc.xyz" },
]

[triggers]
crons = ["7 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "sans"
database_id = "REPLACED_AT_DEPLOY"

[vars]
PUBLIC_URL = "https://sans.ctrjmc.xyz"
CHANNEL = "@parsv2r"
BOT_USERNAME = "SansGuideBot"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/*.woff2"]
fallthrough = true
